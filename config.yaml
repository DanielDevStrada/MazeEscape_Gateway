model_list:
  - model_name: local-agent # Use this for easy tasks
    litellm_params:
      model: ollama/llama3.1
      api_base: http://localhost:11434

  - model_name: expert-agent  # Use this for complex tasks
    litellm_params:
      model: gemini/gemini-1.5-pro
      api_key: os.environ/GEMINI_API_KEY

  - model_name: auto-agent
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_config:
        tiers:
          SIMPLE: ["local-agent"]
          COMPLEX: ["expert-agent", "local-agent"]
        default_model: local-agent